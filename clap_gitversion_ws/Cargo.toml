[package]
name = "{{project-name}}"
version = "0.1.0"
edition = "2024"
description = "{{project-description}}"
repository = "https://github.com/{{gh-username}}/{{project-name}}"
license = "MIT OR Apache-2.0"

[package.metadata]
authors = ["{{authors}}"]

[workspace]
members = ["crates/cli"]

[dependencies]
anyhow = { version = "1.0.104", default-features = false }
cli = { path = "crates/cli" }

[profile.release]
opt-level = "z"  # Optimize for size.
strip = true  # Automatically strip symbols from the binary.
lto = true
codegen-units = 1
