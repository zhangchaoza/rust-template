[package]
name = "cli"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { version = "1.0.104", default-features = false }
clap = { version = "4.6.7", default-features = true, features = ["color", "derive", "error-context", "help", "std", "suggestions", "usage"] }
log = "0.4.35"
once_cell = { version = "1.21.4", default-features = false, features = ["std"] }
serde = {
  version = "1.0.229",
  default-features = false,
  features = [
    "serde_derive",
  ]
}
serde_json = "1.0.154"
simplelog = "0.12.2"
time = { version = "0.3.55", default-features = false }

[build-dependencies]
gitversion_build = "0.1.5"
