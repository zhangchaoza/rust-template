[package]
name = "{{project-name}}"
version = "0.1.0"
edition = "2024"
description = "{{project-description}}"
repository = "https://github.com/{{gh-username}}/{{project-name}}"
license = "MIT OR Apache-2.0"

[package.metadata]
authors = ["{{authors}}"]

[dependencies]
anyhow = { version = "1.0.104", default-features = false }
clap = { version = "4.6.7", default-features = true, features = ["color", "derive", "error-context", "help", "std", "suggestions", "usage"] }
log = "0.4.35"
once_cell = { version = "1.21.4", default-features = false, features = ["std"] }
serde = {
  version = "1.0.229",
  default-features = false,
  features = [
    "serde_derive",
  ]
}
simplelog = "0.12.2"
time = { version = "0.3.55", default-features = false }

[dev-dependencies]
test-log = "0.2.21"

[build-dependencies]
gitversion_build = "0.1.5"

[profile.release]
opt-level = "z"  # Optimize for size.
strip = true  # Automatically strip symbols from the binary.
lto = true
codegen-units = 1
