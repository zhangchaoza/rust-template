name: Build Template
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PROJECT_NAME: rust-gh-example
    strategy:
      matrix:
        template:
          - "clap_gitversion"
          - "clap_gitversion_175"
          - "clap_gitversion_ws"
          - "clap_gitversion_ws_175"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3.2.1
        with:
          versionSpec: "6.8.x"
      - name: Run cargo generate
        uses: cargo-generate/cargo-generate-action@v0.20.0
        with:
          name: ${{ env.PROJECT_NAME }}
          template: ${{ matrix.template }}
          arguments: "--template-values-file .github/workflows/template_values.toml --verbose"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cargo check
        # we need to move the generated project to a temp folder, away from the template project
        # otherwise `cargo` runs would fail
        # see https://github.com/rust-lang/cargo/issues/9922
        run: |
          mv $PROJECT_NAME ${{ runner.temp }}/
          cd ${{ runner.temp }}/$PROJECT_NAME
          cargo check --tests
          rm -rf ${{ runner.temp }}/$PROJECT_NAME
